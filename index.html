<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link rel="stylesheet" href="./homepage.css" />
    <link rel="stylesheet" href="./components/projectCard/card.css" />
    <title>100 Days JavaScript Commitment</title>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <h1>100 Days JavaScript Commitment</h1>
        <p>
          A journey through 100 JavaScript projects using Vanilla JavaScript
        </p>
      </header>
      <main>
        <!-- stats for the project -->
        <section class="stats">
          <div class="stat-item">
            <h3 class="completed">2</h3>
            <p>Projects Completed</p>
          </div>
          <div class="stat-item">
            <h3 class="remaining">98</h3>
            <p>To Go</p>
          </div>
          <div class="stat-item">
            <h3 class="progress">2%</h3>
            <p>Progress</p>
          </div>
        </section>

        <!-- Content will be dynamically added here -->
        <div class="card-container"></div>
      </main>

      <!-- Footer -->
      <footer>
        <p>
          &copy; <span id="year"></span> - 100 Days JavaScript Commitment |
          Built with ❤️ and JavaScript
        </p>
      </footer>
    </div>
    <script src="./assets/js/projectsList.js"></script>
    <!-- <script src="./assets/js/card.js"></script> -->
    <script src="./assets/js/main.js"></script>
  </body>
</html>
