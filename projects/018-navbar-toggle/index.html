<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>018 - Navbar Toggle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        background: #8edbff;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: start;
        align-items: center;
      }

      .heading {
        font-size: 40px;
        font-weight: 800;
        color: #ffffff;
        text-shadow: 5px 10px 20px rgba(0, 0, 0, 0.6);
      }
      .navbar-toggle {
        position: fixed;
        top: 2rem;
        left: 1rem;
        display: flex;
        justify-content: center;
        z-index: 300;
      }

      .hamburger {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 30px;
        height: 20px;
        background: none;
        border: none;
        cursor: pointer;

        /* z-index: 200; */
      }

      .hamburger span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: #252525;
        border-radius: 5px;
        transition:
          transform 0.4s ease-in-out,
          opacity 0.4s ease-in-out;
        /* pointer-events: none; */
      }

      .hamburger.is-open span:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
      }
      .hamburger.is-open span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.is-open span:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }
      .overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.5);
        /* below two acts at the same time, invisible and unclickable */
        opacity: 1;
        visibility: visible;
        z-index: 100;
        transition:
          opacity 0.4s ease-in,
          visibility 0.4s ease-in;
      }

      .drawer {
        position: fixed;
        top: 0px;
        left: 0px;
        padding-top: 80px;
        background-color: #dfdfdf;
        height: 100vh;
        width: 200px;
        color: #242424;
        transform: translateX(-100%);
        transition: transform 0.4s ease-in-out;
        z-index: 200;
      }
      .drawer.is-open {
        transform: translateX(0%);
      }

      .nav-links {
        list-style: none;
      }
      .nav-link {
        display: block;
        text-decoration: none;
        padding: 0.8rem 1rem;
        color: #2c2c2c;
        transition:
          background-color 0.3s ease,
          color 0.3s ease-in;
      }

      .nav-link:hover {
        background-color: #0c0c1e;
        color: #dedede;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Navbar Toggle</h1>
      <div class="navbar-toggle">
        <button
          class="hamburger is-open"
          id="hamburger"
          aria-label="Toggle menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="drawer is-open" id="drawer">
      <ul class="nav-links">
        <li><a href="#" class="nav-link">Home</a></li>
        <li><a href="#" class="nav-link">About</a></li>
        <li><a href="#" class="nav-link">Services</a></li>
        <li><a href="#" class="nav-link">Contact</a></li>
      </ul>
    </div>
    <script></script>
  </body>
</html>
