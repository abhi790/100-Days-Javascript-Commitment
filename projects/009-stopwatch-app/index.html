<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <title>009 - Stopwatch</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <h1 class="heading">StopWatch</h1>
        <p class="display-time">
          <span class="hours">00</span> <span class="seperator">:</span>
          <span class="minutes">00</span> <span class="seperator">:</span>
          <span class="seconds">00</span> <span class="seperator">:</span>
          <span class="miliseconds">00</span>
        </p>
        <div class="button-container">
          <button class="btn btn-start">Start</button>
          <button class="btn btn-stop">Stop</button>
          <button class="btn btn-reset">Reset</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
