<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <title>006 - Accordian Menu</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        background: rgb(142, 219, 255);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .accordian {
        width: 700px;
        min-height: 450px;
        background-color: rgb(255, 255, 255);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        gap: 2px;
        box-shadow: 20px 25px 20px rgba(225, 0, 255, 0.25);
        padding: 1rem;
      }
      .accordian-item {
        /* background-color: green; */
        padding: 0.1rem;
        width: 100%;
      }
      .accordian-header {
        /* background-color: rgb(255, 138, 138); */
        padding: 0 0.5rem;
        position: relative;
      }

      .accordian-header:hover {
        background-color: #f8f9fa;
      }
      .accordian-header.active {
        background-color: #667eea;
        color: white;
        transition: all 0.8s ease;
      }

      .accordian-content {
        background-color: #fafafa;
        max-height: 0;
        overflow: hidden;
      }

      .accordian-content.active {
        max-height: 500px;
        padding: 20px 25px;
        transition: all 0.8s ease;
      }
      .accordian-content p {
        color: #555;
        line-height: 1.8;
        font-size: 0.95rem;
      }
      .accordian-header span {
        position: absolute;
        top: 50%;
        right: 10px;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 8px solid #667eea;
        transition: all 0.8s ease;
      }
      .accordian-header.active span {
        border-top: 8px solid white;
        transform: rotate(180deg);
        transition: all 0.8s ease;
      }

      .horizontal-line {
        border: 1px solid rgb(12, 12, 12);
        width: 100%;
        margin: 0 auto;
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="accordian">
        <h1>Frequently asked Questions :</h1>
      </div>
      <!-- modal -->
    </main>
    <script src="faqData.js"></script>
    <script>
      const accordian = document.querySelector(".accordian");

      //   create accordian when html page loads
      function createAccordian() {
        faqData.forEach((data) => {
          const accordianItem = document.createElement("div");
          accordianItem.className = "accordian-item";

          accordianItem.innerHTML = `<div class="accordian-header"><h3>${data.question}</h3> <span></span></div>
           <div class="accordian-content"><p>${data.answer}</p>
           </div>
           <hr class="horizontal-line"/>
           `;

          accordian.appendChild(accordianItem);
        });
      }
      createAccordian();

      const accordianHeaders = document.querySelectorAll(".accordian-header");

      accordianHeaders.forEach((accordianHeader) => {
        accordianHeader.addEventListener("click", () => {
          const isActive = accordianHeader.classList.contains("active");
          // remove all active class first
          document.querySelectorAll(".accordian-header").forEach((header) => {
            header.classList.remove("active");
            header.nextElementSibling.classList.remove("active");
          });

          if (!isActive) {
            accordianHeader.classList.add("active");
            accordianHeader.nextElementSibling.classList.add("active");
          }
        });
      });
    </script>
  </body>
</html>
