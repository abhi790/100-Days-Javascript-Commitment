<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <title>007 - Todo List basics</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        background: rgb(142, 219, 255);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 1200px;
        /* background-color: green; */
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }
      .card {
        position: relative;
        background-color: #ffffff;
        max-width: 700px;
        min-height: 500px;
        width: 100%;
        border-radius: 15px;
        padding: 1rem;
        text-align: center;
        display: flex;
        flex-direction: column;
      }
      .heading {
        font-size: 30px;
        background-color: #f3f3f3;
        width: 100%;
        border-radius: 10px;
        padding: 1rem 0;

        color: #5e5e5e;
      }
      .input-container {
        display: flex;
        margin-top: 10px;
        gap: 10px;
      }
      .input-container #input {
        flex: 1;
        padding: 0.5rem 1rem;
        border-radius: 5px;
        border: 1px solid grey;
      }

      ul {
        list-style: none;
      }

      .todo-container {
        flex: 1;
        /* background-color: green; */
        width: 100%;
        display: flex;
        gap: 5px;
        flex-direction: column;
        margin-top: 10px;
      }
      .todo-container .list-item {
        background-color: rgb(228, 228, 228);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 5px;
        padding: 0.5rem;
      }
      .list-item .item {
        /* background-color: rgb(247, 247, 247); */
        display: flex;
        gap: 20px;
        padding: 1rem;
        align-items: center;
        justify-content: space-between;
      }
      .list-item span {
        cursor: pointer;
        padding: 1rem;
        background-color: rgb(235, 235, 235);
        border-radius: 5px;
      }
      .list-item span:hover {
        background-color: rgb(216, 216, 216);
      }

      .input-container #add-btn {
        background-color: #2f00ff;
        padding: 0.5rem 1rem;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        color: #ffffff;
      }
      .input-container #add-btn:hover {
        background-color: #009499;
        color: #ffffff;
      }
      .item i {
        display: flex;
        background-color: red;
        padding: 1rem;
      }
      .summary {
        display: flex;
        background-color: rgb(240, 240, 240);
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        border-radius: 5px;
        font-size: 20px;
        margin-top: 20px;
      }
      .summary div {
        display: flex;
        gap: 20px;
        padding: 0.4rem;
        align-items: center;
        background-color: rgb(221, 221, 221);
        padding: 0.5rem 1rem;
        border-radius: 5px;
        cursor: pointer;
      }
      .summary div:hover {
        background-color: rgb(230, 230, 230);
      }
    </style>
    <style></style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 class="heading">Todos Basics</h1>
        <div class="input-container">
          <input id="input" type="" name="" value="" placeholder="Add a task" />
          <button id="add-btn">Add task</button>
        </div>
        <ul class="todo-container"></ul>

        <div class="summary">
          <p><span class="count"></span> task left</p>
          <div class="clear">
            <p>clear all</p>
            <span><i class="fa-solid fa-angle-right"></i></span>
          </div>
        </div>
      </div>
    </div>
    <!-- <script src="script.js"></script> -->
    <script>
      const todoContainer = document.querySelector(".todo-container");
      const btnAddTask = document.querySelector("#add-btn");
      const input = document.querySelector("#input");
      const count = document.querySelector(".count");
      let todos = [
        {
          id: 1,
          task: "Complete CSS checkbox tutorial",
          completed: false,
        },
        {
          id: 2,
          task: "Build todo app with custom checkboxes",
          completed: true,
        },
        {
          id: 3,
          task: "Practice JavaScript array methods",
          completed: false,
        },
      ];
      renderTodos();
      updateCount();
      //   update count
      function updateCount() {
        count.textContent = `${todos.length}`;
      }
      //   display todos and call updateCount
      function renderTodos() {
        todoContainer.innerHTML = "";
        todos.forEach((todo) => {
          const todoItem = document.createElement("li");
          todoItem.className = "list-item";
          todoItem.innerHTML = `<div class="item">
                <input type="checkbox" name="" value="" />
                <p>${todo.task}</p>
              </div>
              <span class="delete-btn"><i class="fa-solid fa-trash"></i></span>`;

          todoContainer.insertAdjacentElement("beforeend", todoItem);

          //   adding event listener on trash icon
          const btn = todoItem.querySelector(".delete-btn");
          btn.addEventListener("click", () => {
            // console.log(btn);
            todoItem.remove();
            deleteTodo(todo.id);
          });
        });
        updateCount();
      }

      function deleteTodo(id) {
        // using filter to eliminate particular todo on which click occur
        todos = todos.filter((todo) => todo.id !== id);
        updateCount();
      }

      function createToDoObject(task) {
        const id = todos.length > 0 ? todos[todos.length - 1].id + 1 : 1;
        return { id, task, completed: false };
      }

      //logic to add new todos to todoContainer and update todos array
      function addToDos() {
        const task = input.value.trim();
        input.value = "";
        if (!task) {
          alert("Please enter a todo.");
          return;
        }
        // update the todos array
        const todo = createToDoObject(task);
        todos.push(todo);
        renderTodos();
      }

      //   logic to implement clear all
      function clearAllTodos() {
        if (confirm("Are you sure want to clear all todos?")) {
          todos = [];
          renderTodos();
        }
      }

      //   add new task on button click
      btnAddTask.addEventListener("click", addToDos);
      //   add new task on enter press
      document.addEventListener("keypress", (event) => {
        if (event.key === "Enter") addToDos();
      });

      //   clear all todos
      document.querySelector(".clear").addEventListener("click", clearAllTodos);
    </script>
  </body>
</html>
