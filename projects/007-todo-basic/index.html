<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <title>007 - Todo List basics</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 class="heading">Todos Basics</h1>
        <div class="input-container">
          <input id="input" type="" name="" value="" placeholder="Add a task" />
          <button id="add-btn">Add task</button>
        </div>
        <ul class="todo-container"></ul>

        <div class="summary">
          <p><span class="count"></span> task left</p>
          <div class="clear">
            <p>clear all</p>
            <span><i class="fa-solid fa-angle-right"></i></span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
