<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: green;
        min-height: 100vh;
      }
      .container {
        width: 1200px;
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        width: 700px;
        height: 600px;
        background-color: rgb(202, 202, 202);
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://picsum.photos/280/200" alt="Course" />
      <div class="card-content">
        <h2>Digital Landscapes</h2>
        <p>Course by <strong>Pierre Deschamps</strong></p>

        <!-- Info Section -->
        <div class="info-row">
          <span>📚 11 Lessons</span>
          <span>📈 Intermediate</span>
        </div>
        <div class="info-row">
          <span>⏱ 23 Hours</span>
        </div>

        <button class="btn">Course Details</button>
      </div>
    </div>
  </body>
</html>
