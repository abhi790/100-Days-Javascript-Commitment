<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>014 Characters Counter</title>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <h1 class="heading">📝 Character Counter</h1>
        <textarea id="textInput" placeholder="Type here somethings"></textarea>
        <div class="stats">
          <div class="stat-box">
            <h3>Characters</h3>
            <p id="charCount">0</p>
          </div>
          <div class="stat-box">
            <h3>Words</h3>
            <p id="wordCount">0</p>
          </div>
        </div>

        <div class="button-container">
          <button class="btn btn-clear" id="clearBtn">Clear</button>
          <button class="btn btn-copy" id="copyBtn">
            <i class="fa-solid fa-paste"></i>Copy
          </button>
        </div>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
