<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <title>003 Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <h1>Tip Calcultor</h1>
        <div class="horizontal-line"></div>
        <div class="bill">
          <p>Bill</p>
          <div class="bill_amount" style="display: flex">
            <p class="money">$</p>
            <input
              class="billInput"
              type="number"
              name="bill_amount"
              value="0"
            />
          </div>
        </div>
        <div class="bill">
          <p>Select Tip (%)</p>
          <div class="button-container">
            <button class="btn tip-btn btn-active">5</button>
            <button class="btn tip-btn">10</button>
            <button class="btn tip-btn">15</button>
            <button class="btn tip-btn">20</button>
          </div>
        </div>

        <div class="horizontal-line"></div>
        <div class="result_container">
          <div class="result_box">
            <p>Tip Amount</p>
            <h2 class="amount tip-display">$0</h2>
          </div>
          <div class="result_box">
            <p>Total Amount</p>
            <h2 class="amount total-display">$0</h2>
          </div>
        </div>
        <button class="btn btn-calculate">Calculate</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
