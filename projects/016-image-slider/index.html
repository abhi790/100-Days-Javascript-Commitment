<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />

    <title>016 - Image Slider</title>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="heading">🖼️ Image Slider</div>
        <div class="slider-container">
          <div class="slider-wrapper" id="sliderWrapper"></div>

          <!-- Navigation Buttons -->
          <button class="slider-btn prev" id="prevBtn">❮</button>
          <button class="slider-btn next" id="nextBtn">❯</button>

          <!-- Dots Indicators -->
          <div class="slider-dots" id="sliderDots"></div>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
