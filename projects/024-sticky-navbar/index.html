<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild Explorer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Top Bar -->
    <section class="top-bar">
      <p>🌍 Explore the Wild — Every Animal Has a Story</p>
    </section>

    <!-- Sticky Navbar -->
    <nav class="navbar">
      <div class="logo">🐾 Wild Explorer</div>
      <ul class="nav-links">
        <li>
          <a href="#home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </a>
        </li>
        <li>
          <a href="#animals">
            <i class="fa-solid fa-paw"></i>
            <span>Animals</span>
          </a>
        </li>
        <li>
          <a href="#gallery">
            <i class="fa-solid fa-image"></i>
            <span>Gallery</span>
          </a>
        </li>
        <li>
          <a href="#contact">
            <i class="fa-solid fa-envelope"></i>
            <span>Contact</span>
          </a>
        </li>
      </ul>
    </nav>
    <div class="container">
      <!-- Main Content -->
      <main>
        <!-- Hero Section -->
        <div class="hero-container" id="home">
          <img
            src="https://images.unsplash.com/photo-1526246708488-d433888791b7?w=1400"
            alt="Wild Animal"
            class="hero-image"
          />
          <div class="hero-text">
            <h1>Welcome to Wild Explorer</h1>
            <p>Discover the most fascinating creatures on our planet</p>
          </div>
        </div>

        <!-- Animal Cards -->
        <div class="animal-container" id="animals"></div>

        <!-- Footer -->
        <footer class="contact" id="contact">
          <h2>Contact</h2>
          <p>Email: hello@wildexplorer.com</p>
        </footer>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
