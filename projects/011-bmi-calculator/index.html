<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>011 BMI Calculator</title>

    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="heading">BMI Calculator</div>
        <div class="choose-metrics">
          <button class="btn btn-metric">
            <i class="fa fa-pie-chart"></i>Metric
          </button>
          <button class="btn btn-imperial">
            <i class="fa fa-bar-chart"></i>Imperial
          </button>
        </div>
        <div class="input-container"></div>
        <button class="btn btn-calculate">Calculate BMI</button>
        <div class="result-container">
          <span class="bmi"> 45</span>
          <span class="decision">Normal</span>
        </div>
        <h2 class="heading2">BMI Categories</h2>
        <div class="category-container"></div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
