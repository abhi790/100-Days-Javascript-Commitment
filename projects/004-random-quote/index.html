<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>004 - Random Quote Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <h1>Random Quote Generator</h1>
        <hr class="horizontal-line" />
        <div class="display-quote">
          <i class="fa-solid fa-quote-left inverted"></i>
          <p class="quote">
            <q> It is never too late to be what you might have been</q>
          </p>
          <h3 class="author">~George Elliot</h3>
        </div>
        <div class="button-container">
          <button class="btn icon-btn btn-new">
            <i class="fa-solid fa-quote-left"></i> New Quote
          </button>
          <button class="btn icon-btn btn-copy">
            <i class="fa-solid fa-paste"></i> Copy
          </button>
          <button class="btn icon-btn btn-share">
            <i class="fa-brands fa-twitter"></i> Tweet
          </button>
        </div>
      </div>
    </main>
    <script src="quotes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
