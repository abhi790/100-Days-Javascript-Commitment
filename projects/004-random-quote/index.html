      .btn {

        padding: 12px 24px;
        border-radius: 10px;
        background: grey;
        font-size: 15px;
        font-weight: 700;
        color: white;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25);
        transition: all 0.3s ease;

      }
      .display-quote {

        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .quote {
        font-style: italic;
        font-size: 40px;
      }
      .display-quote .author {
        font-weight: 500;
        margin-top: 1rem;
      }
      .inverted {
        font-size: 50px;
        margin-top: 0;
      }
      .small-quote {
        position: absolute;
        font-size: 10px;
      }
