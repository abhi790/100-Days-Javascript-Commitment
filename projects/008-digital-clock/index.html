  <body>
    <main class="container">
      <div class="outer-body">
        <h1 class="heading">Digital Clock</h1>
        <div class="clock">
          <div class="format">
            <button class="btn btn-12 active">12-hour</button>
            <button class="btn btn-24">24-hour</button>
          </div>
          <div class="time">
            <span class="hours">10</span><span class="colon">:</span
            ><span class="minutes">45</span><span class="colon">:</span
            ><span class="seconds">07</span><span class="period">AM</span>
          </div>

          <div class="date">Monday, April 22, 2026</div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
