<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="100 Days JavaScript Commitment - A collection of 100 JavaScript projects"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>013 Random Password Generator</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="heading">Random Password Generator</div>
        <!-- password selection -->
        <div class="length-section">
          <div class="password-selection">
            <label>Password Length : </label>
            <span class="length-indicator">12</span>
          </div>
          <input
            type="range"
            min="8"
            max="128"
            value="8"
            id="password-length"
          />
        </div>
        <!-- checkboxes -->
        <div class="options-section">
          <label
            ><input class="checkbox" type="checkbox" data-char="uppercase" />
            Uppercase</label
          >
          <label
            ><input class="checkbox" type="checkbox" data-char="lowercase" />
            Lowercase</label
          >
          <label
            ><input class="checkbox" type="checkbox" data-char="numbers" />
            Numbers</label
          >
          <label
            ><input class="checkbox" type="checkbox" data-char="symbols" />
            Symbols</label
          >
          <span class="error"></span>
        </div>
        <button class="btn generate-btn">Generate Password</button>
        <div class="result-container">
          <p class="display-result">vL5$3!mRfbn!8aG</p>
          <span><i class="fa-solid fa-paste"></i></span>
        </div>
        <div class="indicator-container">
          <div class="left">
            <div class="indicator">
              <div class="box weak"></div>
              <p>Weak</p>
            </div>
            <div class="indicator">
              <div class="box medium"></div>
              <p>Medium</p>
            </div>
            <div class="indicator">
              <div class="box strong"></div>
              <p>Strong</p>
            </div>
            <div class="indicator">
              <div class="box super-strong"></div>
              <p>Super</p>
            </div>
          </div>
          <button class="btn clear">Clear</button>
        </div>
      </div>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
