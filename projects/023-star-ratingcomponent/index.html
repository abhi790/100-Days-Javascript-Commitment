<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>023 - Star Rating</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <style>
      :root {
        --bg: #f9f9f9;
        --bg-container: #ffffff;
        --text-primary: #333333;
        --star-default: #d3d3d3;
        --star-active: #f5a623;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        background: var(--bg-container);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h1 {
        color: var(--text-primary);
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .stars {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem;
      }

      .star {
        font-size: 32px;
        color: var(--star-default);
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .star:hover {
        color: var(--star-active);
      }

      .star.active {
        color: var(--star-active);
      }

      .rating-text {
        font-size: 16px;
        color: var(--text-primary);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1><i class="fa-solid fa-star"></i> Rate Your Experience</h1>
      <div class="stars">
        <i class="fa-solid fa-star star" data-value="1"></i>

        <i class="fa-solid fa-star star" data-value="2"></i>
        <i class="fa-solid fa-star star" data-value="3"></i>
        <i class="fa-solid fa-star star" data-value="4"></i>
        <i class="fa-solid fa-star star" data-value="5"></i>
      </div>
      <p class="rating-text">Click to rate</p>
    </div>
    <script>
      const allStarsEle = document.querySelectorAll(".star");
      //   console.log(allStarsEle);
      const textEle = document.querySelector(".rating-text");
      //   console.log(textEle);

      allStarsEle.forEach((star) => {
        star.addEventListener("click", () => {
          const item = star.dataset;

          //   remove every active class
          allStarsEle.forEach((star) => {
            star.classList.remove("active");
          });

          let length = Number(item.value);
          for (let i = 0; i < length; i++) {
            allStarsEle[i].classList.add("active");
          }
          const message =
            length === 5
              ? `Fabolous ${length} star`
              : `You rated ${length} out of 5`;
          textEle.textContent = message;
        });
      });
    </script>
  </body>
</html>
